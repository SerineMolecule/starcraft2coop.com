name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - uses: oven-sh/setup-bun@main
    - name: Set up PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: none

    # - name: Validate composer.json and composer.lock
    #   run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@main
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress && touch -m vendor

    - name: Check PHP formatting with Mago
      run: make check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint PHP with Mago
      run: make lint
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Analyze PHP with Mago
      run: make analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Bun dependencies
      run: bun install

    - name: Validate JSON schemas
      run: bun ./source-data/validate.ts

    - name: Run Bun tests
      run: make bun-test

    - name: Run PHP calculator tests
      run: make php-test
