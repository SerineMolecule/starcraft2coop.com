<svg xmlns="http://www.w3.org/2000/svg" width="18" height="16" viewBox="0 0 18 16">
  <defs>
    <filter id="energy-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".55" result="blur"/>
      <feFlood flood-color="#c900ed"/>
      <feComposite operator="in" in2="blur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="3,1 10,1 14,9 9.5,9 12,14 4,6 8,6"
    fill="#ef00ff" stroke="#fff2ff" stroke-width=".55" stroke-linejoin="round" filter="url(#energy-glow)"/>
</svg>
